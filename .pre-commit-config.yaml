repos:
  # Project-owned extension of the tasker local unit (agent_gest_git_skills 9225e7b).
  # The commit and trailer hooks are unchanged; the pre-push hook runs pre_push.py of agent_gest_git_skills 0.7.
  - repo: local
    hooks:
      - id: commit-gate
        name: commit gate
        entry: uv run --no-project --quiet --no-python-downloads --python '>=3.9' python .agents/skills/gcm/scripts/commit_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      # The gate runs once more on the message, and stamps the commit with the trailer that just ci-gate checks
      - id: commit-gate-trailer
        name: commit gate trailer
        entry: uv run --no-project --quiet --no-python-downloads --python '>=3.9' python .agents/skills/gcm/scripts/commit_gate.py --hook commit-msg
        language: system
        always_run: true
        stages: [commit-msg]
      # What CI checks, on your machine before a push: just ci, less each recipe that a pass of just check for the
      # pushed tree already ran. ci-gate always runs.
      - id: just-ci
        name: just ci
        entry: uv run --no-project --quiet --no-python-downloads --python '>=3.9' python .agents/skills/gcm/scripts/pre_push.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: verify-libsql-vendor
        name: verify complete libsql source and staged identity
        entry: python3 scripts/verify-libsql-vendor.py --index
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit]

  # Project-owned replacement of the tasker upstream-hooks unit (agent_gest_git_skills 9225e7b).
  # The exact size exceptions are replaced by complete byte verification below.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit, pre-merge-commit]
      - id: check-json
        stages: [pre-commit, pre-merge-commit]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: '^vendor/libsql-ffi/(?:bundled/src/sqlite3\.c|bundled/SQLite3MultipleCiphers/src/(?:sqlite3\.c|shell\.c|sqlite3patched\.c))$'
        stages: [pre-commit, pre-merge-commit]
      - id: check-merge-conflict
        stages: [pre-commit, pre-merge-commit]
      - id: detect-private-key
        stages: [pre-commit, pre-merge-commit]
