project:
  type: website
  output-dir: _site
  resources:
    - libsql-provider.html
    - libsql-import-boundary.html

website:
  title: Gossil
  description: Rust library and CLI for Fossil delta bytes, glob matching, artifacts and local storage
  site-url: https://rahuldave.com/gossil/
  repo-url: https://github.com/rahuldave/gossil
  repo-subdir: docs
  page-navigation: true
  navbar:
    left:
      - href: getting-started.md
        text: Start
      - href: concepts.md
        text: Library concepts
      - href: cli.md
        text: CLI
      - href: api/index.qmd
        text: Rust API
      - href: development-plan.md
        text: Development
    tools:
      - icon: github
        href: https://github.com/rahuldave/gossil
  sidebar:
    search: true
    contents:
      - index.md
      - getting-started.md
      - cli.md
      - section: Guides
        contents:
          - issues.md
          - working-with-repositories.md
          - compare-with-git.md
          - concepts.md
          - examples.md
          - delta-encoder.md
          - delta-decoder.md
          - blob-primitives.md
          - artifact-checksum.md
          - token-codec.md
          - glob.md
          - file-path.md
          - history.md
          - git-reader.md
          - artifact-parser.md
          - diff.md
          - task-ticket.md
          - gest-ticket.md
          - issue-ticket.md
          - issue-read.md
          - local-storage.md
          - native-storage.md
          - local-records.md
          - gest-task-values.md
          - gest-project-values.md
          - gest-author-values.md
          - gest-artifact-values.md
          - gest-iteration-values.md
          - gest-tag-values.md
          - gest-note-values.md
          - gest-relationship-values.md
          - gest-entity-tag-values.md
          - gest-iteration-task-values.md
          - gest-model.md
      - section: Rust API
        href: api/index.qmd
        contents:
          - auto: "api/**"
      - section: Development
        contents:
          - development-plan.md
          - conformance.md
          - libsql-wrapper.md

# Installed from the canonical repository; exact revision and licenses ship in the extension.
theme: atelier
toc: true
code-copy: true
search: true

api:
  language: rust
  manifest: ../Cargo.toml
  toolchain: nightly-2026-11-12
  root: ..
  source: https://github.com/rahuldave/gossil/blob/main
  out: api
