# The tasker role wrote this file once, when the project had none. It is yours from then on.
# It runs on each push to main. The job check runs just check on the pushed commit. When it passes, the job release
# runs just release, which makes the next tag vX.Y.Z by semver, pushes it and checks it. A push that needs no release,
# such as a change of only the docs, makes no tag. Nobody tags by hand.
# just release takes the number from the commits since the last tag, or from the version of the manifest that the
# language profiles give. It fails when that version is lower than the bump that the commits ask for, so a pull
# request that needs a bump also raises the version of the manifest.
# No agent runs here. The checkout has fetch-depth: 0, so the script sees each tag and each commit.
# Only the job release can write to the repository, to push the tag. A tag that the GITHUB_TOKEN pushes starts no
# other workflow. If a publish job must run on the tag, use a token that can start it.
# Each job starts with its own tools. Check installs Gest for tools-check; both jobs install jlog for Just.
# Add the setup of the tools of your languages before the step "Check", if just check needs them.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-v0.2.0-${{ runner.os }}
      - name: Install jlog
        # The tag v0.2.0 of jlog is the commit 8febdf1, as in the CI of jnterfaces.
        if: steps.jlog.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.2.0 jlog
      - name: Install Gest
        # The tasker role declares this provider in skill-package.json.
        run: cargo install --locked --git https://github.com/rahuldave/gest gest
      - name: Install coverage prerequisites
        run: |
          rustup component add llvm-tools-preview --toolchain stable
          cargo +stable install --locked cargo-llvm-cov@0.9.1
      - name: Install pinned rustdoc JSON generator
        run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - name: Check
        run: just check
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-v0.2.0-${{ runner.os }}
      - name: Install jlog
        # The tag v0.2.0 of jlog is the commit 8febdf1, as in the CI of jnterfaces.
        if: steps.jlog.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.2.0 jlog
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        run: just release
