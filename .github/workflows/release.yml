# The tasker role wrote this file once, when the project had none. It is yours from then on.
# Gossil keeps the event pull_request, so each pull request also runs the full just check on Linux. On each push to
# main, the job check runs just check on the pushed commit. When it passes, the job release runs just release, which
# makes the next tag vX.Y.Z by semver, pushes it and checks it. A push that needs no release, such as a change of only
# the docs, makes no tag. Nobody tags by hand.
# Gossil: the classic protection of main (pull request, checks, admins included) refuses a push by this job to main.
# So in Gossil a pull request that needs a bump raises the version itself, and this job pushes only the tag. See
# AGENTS.md. The rest of this paragraph is the starter's flow, for when GitHub Actions may bypass that protection.
# just release takes the number from the commits since the last tag. In the starter's flow, a pull request does not
# raise the version of the manifest. When the language profiles give a version below the bump that the commits ask for, just release
# writes the bump into the version files and lock files, commits it as "chore(release): vX.Y.Z" by
# github-actions[bot], and pushes that commit to main and its tag together. That commit asks for no bump, so the next
# run stops at its tag. The commit gate passes it, since its author is a GitHub bot.
# A push with the GITHUB_TOKEN starts no other workflow, so the version commit gets no CI run of its own. It changes
# only the version lines. A rule of main that asks for a pull request blocks the push: let GitHub Actions bypass it.
# No agent runs here. The checkout has fetch-depth: 0, so the script sees each tag and each commit.
# just release needs a clean checkout, so run it in its own job, after no step that changes tracked files.
# Only the job release can write to the repository, to push the commit and the tag. A tag that the GITHUB_TOKEN
# pushes starts no other workflow, so put a publish job in this workflow, with needs: release. The tag can be on the
# version commit, not on the pushed commit, so the job checks out needs.release.outputs.tag, as in:
#   binaries:
#     needs: release
#     if: needs.release.outputs.tag != ''
#     steps:
#       - uses: actions/checkout@v4
#         with:
#           ref: ${{ needs.release.outputs.tag }}
# When binaries or publish failed, use "Re-run failed jobs", which keeps the tag of the job release. "Re-run all
# jobs" runs just release again on the pushed commit. It finds the tag on the version commit, prints "already
# released" and gives the tag again. To build a tag by hand, run this workflow with the tag:
# gh workflow run release --ref main -f tag=vX.Y.Z. The job release then skips just release, checks that the tag
# exists and gives it as its output. It makes no new tag. Gossil has no publish job, so such a run builds nothing.
# The job check installs the programs that tools-check needs (jlog, gest and jagt; gh is on the runner), the
# toolchain of rust-toolchain.toml, the coverage tool, the nightly rustdoc of the API pages and the build
# prerequisites of the native references. Each install script comes from the full commit of its release tag, so a
# moved tag cannot change the script. The script still downloads the binary and its .sha256 from the release of the
# tag, so the hash check finds a broken download, not a changed release.
name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag vX.Y.Z, given as the output of the job release. The run makes no new tag and, in Gossil, builds nothing."
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The integration step runs its tests with cargo llvm-cov nextest, which runs the test binaries at the same time.
    # .config/nextest.toml names the tests that run one at a time. The job ci of check.yml runs no integration step,
    # so it neither sets the variable nor installs cargo-nextest.
    env:
      JNPROFILE_RUST_NEXTEST: "1"
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install jlog
        # The tag v0.5.0 of jlog is the commit 224a622a27920256e3d6ad6a8363c9ea96078a20. install.sh comes from that
        # commit. It downloads the release binary, checks it against the .sha256 of the same release and puts it in ~/.local/bin. setup-uv comes
        # first, so install.sh makes the environments of the plugins. The step shell bash has pipefail, so a failed
        # download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/224a622a27920256e3d6ad6a8363c9ea96078a20/scripts/install.sh | sh -s -- --tag v0.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gest v0.6.0 and jagt v0.6.4, which tools-check needs
        # The tag v0.6.0 of gest is the commit 67fb4f37d8e7aff689929bc6de33b4324272a82c, and the tag v0.6.4 of jagt
        # is the commit 604e3fb7754a168a28beeaa908908abd8589eee1. Each install.sh comes from its commit and checks
        # the binary against the .sha256 of the same release.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/gest/67fb4f37d8e7aff689929bc6de33b4324272a82c/scripts/install.sh | sh -s -- --tag v0.6.0
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jagt/604e3fb7754a168a28beeaa908908abd8589eee1/scripts/install.sh | sh -s -- --tag v0.6.4
      # rustup reads rust-toolchain.toml, so the workflow names no channel, and CI runs the compiler of each machine of
      # the project. Do not set RUSTUP_TOOLCHAIN: it would take the place of the file, so the step stops when it is set.
      - name: Install the Rust toolchain of rust-toolchain.toml
        id: rust
        shell: bash
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "::error::RUSTUP_TOOLCHAIN is set. Remove it, so that the toolchain file names the toolchain."
            exit 1
          fi
          test -f rust-toolchain.toml || { echo "::error::Gossil pins its compiler in rust-toolchain.toml, and the file is missing."; exit 1; }
          rustup toolchain install
          # just check needs clippy, rustfmt and llvm-tools-preview. rustup adds them to the toolchain of the file.
          rustup component add clippy rustfmt llvm-tools-preview
          # The key of the cache holds the compiler that runs, as rustc -V prints it. "rustc 1.95.0 (abcdef012
          # 2026-10-01)" becomes 1.95.0-abcdef012-2026-10-01.
          toolchain="$(rustc -V | sed -E 's/^rustc //; s/[^A-Za-z0-9._]+/-/g; s/^-+//; s/-+$//')"
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]; then
            echo "::error::rustc -V printed no version of Rust, so the cache has no key."
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          # The key of the cache holds the image of the runner, such as ubuntu24. The runner sets ImageOS in the
          # environment of each step, but not in the env context of the expressions, so this step writes it to its
          # outputs.
          [[ "${ImageOS:-}" =~ ^[a-z]+[0-9]+$ ]] || { echo "::error::The runner gives no ImageOS, so the cache has no key."; exit 1; }
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      # cargo-llvm-cov comes as a release binary, so no run compiles it. Keep the version as the profile pins it.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # cargo-nextest comes as a release binary too, at the version of the starter of the tasker role.
      - name: Install cargo-nextest
        if: env.JNPROFILE_RUST_NEXTEST == '1'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Install pinned rustdoc JSON generator
        run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - name: Install native reference build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev ca-certificates
      # The cache keeps the crates that cargo downloads and the whole build folder, target/ with
      # target/llvm-cov-target, the warm build of coverage. The key is the runner, the compiler, the word check, the
      # hash of each Cargo.lock and the commit. The release of the image (ImageOS, such as ubuntu24) is in the key
      # too, so that a run on another Ubuntu release never reuses its builds. ImageOS stays the same through the weekly
      # updates of the image, so those reuse the cache. The job ci of check.yml runs on the same image and uses the
      # same word, so it restores this cache too. A restore takes the newest cache with the same Cargo.lock, else the
      # newest cache of the same compiler. A run reads the caches of its own branch, of the base branch of its pull
      # request and of the default branch.
      # Set no CARGO* or RUST* variable from a value that changes on each run, such as github.run_id. The coverage
      # build keeps a fingerprint of these variables, and a new value makes it clean the whole build.
      - name: Restore the Rust cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-${{ steps.rust.outputs.image }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.rust.outputs.image }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ steps.rust.outputs.image }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-
      # The restored target/llvm-cov-target holds the coverage stamp of the commit of main that saved the cache. With
      # that stamp, the coverage build of the profile cleans only the packages that differ from HEAD, and in CI none
      # do. Then only the newer times of the checked-out files would make cargo rebuild the workspace. Without the
      # stamp, the coverage build cleans the whole workspace once, as for a new commit, and keeps the third-party
      # builds warm.
      - name: Drop the coverage stamp of the restored cache
        run: rm -f target/llvm-cov-target/jnprofile-rust-build.txt
      - name: Set up the project
        run: just setup
      - name: Check
        run: just check
      # Only a push to main saves the cache, so a pull request or a manual run saves none. The key holds the commit,
      # so each push to main saves a new cache, and the next run restores the newest. Only a passed check saves.
      - name: Save the Rust cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The tag that the run made, or that was already released, or the given tag, else empty.
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.given.outputs.tag }}
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install jlog
        # The recipes run through the shell jlog that .agents/just/index.just sets, so just release needs jlog too.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/224a622a27920256e3d6ad6a8363c9ea96078a20/scripts/install.sh | sh -s -- --tag v0.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # As in the starter: a recipe of just release that runs cargo runs the toolchain of rust-toolchain.toml.
      - name: Install the Rust toolchain of rust-toolchain.toml
        shell: bash
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "::error::RUSTUP_TOOLCHAIN is set. Remove it, so that the toolchain file names the toolchain."
            exit 1
          fi
          rustup toolchain install
      - name: Name the author of the tag and of the version commit
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # just release writes tag=vX.Y.Z to GITHUB_OUTPUT.
      - name: Release
        if: github.event_name == 'push'
        id: release
        run: just release
      # A run by hand: the tag must be a release tag that exists.
      - name: Take the given tag
        if: github.event_name == 'workflow_dispatch'
        id: given
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "not a release tag vX.Y.Z: $TAG" >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
