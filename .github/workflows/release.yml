# The tasker role wrote this file once, when the project had none. It is yours from then on.
# Gossil keeps the event pull_request, so each pull request also runs the full just check on Linux. On each push to
# main, the job check runs just check on the pushed commit. When it passes, the job release runs just release, which
# makes the next tag vX.Y.Z by semver, pushes it and checks it. A push that needs no release, such as a change of only
# the docs, makes no tag. Nobody tags by hand.
# Gossil: the classic protection of main (pull request, checks, admins included) refuses a push by this job to main.
# So in Gossil a pull request that needs a bump raises the version itself, and this job pushes only the tag. See
# AGENTS.md. The rest of this paragraph is the starter's flow, for when GitHub Actions may bypass that protection.
# just release takes the number from the commits since the last tag. In the starter's flow, a pull request does not
# raise the version of the manifest. When the language profiles give a version below the bump that the commits ask for, just release
# writes the bump into the version files and lock files, commits it as "chore(release): vX.Y.Z" by
# github-actions[bot], and pushes that commit to main and its tag together. That commit asks for no bump, so the next
# run stops at its tag. The commit gate passes it, since its author is a GitHub bot.
# A push with the GITHUB_TOKEN starts no other workflow, so the version commit gets no CI run of its own. It changes
# only the version lines. A rule of main that asks for a pull request blocks the push: let GitHub Actions bypass it.
# No agent runs here. The checkout has fetch-depth: 0, so the script sees each tag and each commit.
# just release needs a clean checkout, so run it in its own job, after no step that changes tracked files.
# Only the job release can write to the repository, to push the commit and the tag. A tag that the GITHUB_TOKEN
# pushes starts no other workflow, so put a publish job in this workflow, with needs: release. The tag can be on the
# version commit, not on the pushed commit, so the job checks out needs.release.outputs.tag, as in:
#   binaries:
#     needs: release
#     if: needs.release.outputs.tag != ''
#     steps:
#       - uses: actions/checkout@v4
#         with:
#           ref: ${{ needs.release.outputs.tag }}
# The job check installs the programs that tools-check needs (jlog, gest and jagt; gh is on the runner), the coverage
# tools, the nightly rustdoc of the API pages and the build prerequisites of the native references.
name: release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install jlog
        # The tag v0.3.0 of jlog is the commit d4b712b, as in the CI of jnterfaces. install.sh comes from the tag. It
        # downloads the release binary, checks its SHA-256 and puts it in ~/.local/bin. setup-uv comes first, so
        # install.sh makes the environments of the plugins. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gest v0.6.0 and jagt v0.6.4, which tools-check needs
        # install.sh of gest comes from its tag v0.6.0, and install.sh of jagt from its tag v0.6.4, as in the CI of
        # agent_gest_git_skills. Each one checks the SHA-256.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/gest/v0.6.0/scripts/install.sh | sh -s -- --tag v0.6.0
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jagt/v0.6.4/scripts/install.sh | sh -s -- --tag v0.6.4
      - name: Install coverage prerequisites
        run: |
          rustup component add llvm-tools-preview --toolchain stable
          cargo +stable install --locked cargo-llvm-cov@0.9.1
      - name: Install pinned rustdoc JSON generator
        run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - name: Install native reference build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev ca-certificates
      - name: Set up the project
        run: just setup
      - name: Check
        run: just check
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The tag that the run made, or that was already on HEAD, else empty.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install jlog
        # The recipes run through the shell jlog that .agents/just/index.just sets, so just release needs jlog too.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Name the author of the tag and of the version commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        id: release
        run: just release
