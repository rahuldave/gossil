# The tasker role wrote this file once, when the project had none. It is yours from then on.
# It runs just ci on each pull request. just ci checks that each commit of the pull request passed the commit gate,
# from the trailer that the gate writes, then runs the steps of the list ci of .agents/stack.json. It does not run
# just check again: the gate saw a pass of it for each commit. Put a step in the list ci only when a clean machine
# tells you something that your own machine cannot, for example a test on Linux.
# No agent runs here. The fresh agents of the commit gates run on your machine, before each commit.
# It uses the committed files and does not run just install. An install can change tracked files.
# The trailers need the whole history, so the checkout has fetch-depth: 0. The checkout takes the head of the pull
# request, not the merge commit that GitHub makes, since that commit has no trailer.
# Keep the event pull_request, not pull_request_target. The steps run the code of the pull request, and
# pull_request_target would give that code the secrets of the repository.
# Add the setup of the tools of your languages before the step "CI", if a step of the list ci needs them.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-8febdf18387974f38047abbe88b7473bc5f27bb9-${{ runner.os }}-${{ runner.arch }}
      - name: Install jlog
        if: steps.jlog.outputs.cache-hit != 'true'
        # jlog v0.2.0 provides the run command used by the required recipes.
        run: cargo install --locked --git https://github.com/rahuldave/jlog --rev 8febdf18387974f38047abbe88b7473bc5f27bb9 jlog
      - name: Verify complete vendored provider
        run: |
          python3 scripts/verify-libsql-vendor.py
          python3 -m unittest discover -s tests -p 'test_libsql_vendor.py' -v
      - name: Install pinned rustdoc JSON generator
        run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - name: Compile provider, check date semantics and build API docs on Linux
        run: |
          just libsql-provider-compile
          just libsql-provider-dates
          just docs-build
      - name: CI
        env:
          JN_CI_BASE: ${{ github.event.pull_request.base.sha }}
          JN_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: just ci
