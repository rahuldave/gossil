# Written once by the docs role of jnterfaces. It is yours from then on.
# Main publishes through Just/smalldocs, then deploys the built site with the Pages artifact API.
# Set Settings, Pages, Source to GitHub Actions. A GITHUB_TOKEN branch push alone does not deploy Pages.
name: Publish the docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges publish one after the other, so the later push to gh-pages does not race the first.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    # A private repository skips the job, and does not install jlog only to skip. just docs-publish checks again.
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install pinned rustdoc JSON generator
        run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - name: Install jlog, the shell of the recipes
        # The tag v0.3.0 of jlog is the commit d4b712b. install.sh comes from the tag. It downloads the release binary,
        # checks its SHA-256 and puts it in ~/.local/bin. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set the git user for the push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish through Just and smalldocs
        run: just docs-publish
      - name: Build the Pages artifact
        run: just docs-build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
