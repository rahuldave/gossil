[package]
name = "gossil"
version = "0.13.0"
edition = "2024"

[dependencies]
dir_spec = "0.5"
toml = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }
chrono = { version = "=0.4.44", default-features = false, features = ["alloc"] }
md-5 = "=0.10.6"
libsql = { version = "=0.10.0", default-features = false, features = ["core"] }
libsql-ffi = { version = "=0.10.0", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1collisiondetection = { version = "0.3", default-features = false, features = ["std"] }
keccak = "0.1"
flate2 = "1"

[[bin]]
name = "gossil-conformance"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"

[[bin]]
name = "gossil"
path = "src/bin/gossil.rs"

[[test]]
name = "delta_decoder"
path = "tests/delta_decoder.rs"

[[test]]
name = "delta_cli"
path = "tests/delta_cli.rs"

# The target of tests/glob.rs must not be named glob. cargo-llvm-cov runs `cargo clean -p gossil` before each
# coverage run, and that clean removes files by target name, so it also deleted the outputs of the registry crate
# glob, a build dependency of libsql-ffi, and each coverage run rebuilt seven crates and the C code of libSQL.
[[test]]
name = "glob_port"
path = "tests/glob.rs"

[patch.crates-io]
libsql = { git = "https://github.com/rahuldave/gossil-libsql", rev = "c02db34ae8a7e91ca7ab8faee18fe41515626940" }
libsql-ffi = { path = "vendor/libsql-ffi" }

[[bin]]
name = "gos"
path = "src/bin/gos.rs"
