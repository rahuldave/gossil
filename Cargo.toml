[package]
name = "gossil"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "gossil-conformance"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gossil"
path = "src/bin/gossil.rs"

[[test]]
name = "delta_decoder"
path = "tests/delta_decoder.rs"

[[test]]
name = "delta_cli"
path = "tests/delta_cli.rs"
