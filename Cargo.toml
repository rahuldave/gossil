[package]
name = "gossil"
version = "0.6.0"
edition = "2024"

[dependencies]
dir_spec = "0.5"
yaml_serde = "0.10"
mime = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
toml = "1"
crossterm = "0.29"
terminal_size = "0.4"
unicode-width = "0.2"
yansi = { version = "1", features = ["detect-env", "detect-tty", "hyperlink"] }
askama = "0.16"
getset = "0.1"
notify = "8"
thiserror = "2"
axum = "0.8"
log = "0.4"
pulldown-cmark = "=0.13.4"
clap = { version = "=4.6.1", features = ["derive", "string"] }
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "rt", "time"] }
chrono = { version = "=0.4.44", default-features = false, features = ["alloc", "clock", "serde"] }
md-5 = "=0.10.6"
libsql = { version = "=0.10.0", default-features = false, features = ["core"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1collisiondetection = { version = "0.3", default-features = false, features = ["std"] }
keccak = "0.1"
flate2 = "1"

[[bin]]
name = "gossil-conformance"
path = "src/main.rs"

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"

[[bin]]
name = "gossil"
path = "src/bin/gossil.rs"

[[test]]
name = "delta_decoder"
path = "tests/delta_decoder.rs"

[[test]]
name = "delta_cli"
path = "tests/delta_cli.rs"

[patch.crates-io]
libsql = { git = "https://github.com/rahuldave/gossil-libsql", rev = "c02db34ae8a7e91ca7ab8faee18fe41515626940" }
libsql-ffi = { path = "vendor/libsql-ffi" }

[[bin]]
name = "gos"
path = "src/bin/gos.rs"

[[test]]
name = "build_metadata"
path = "build.rs"
